      <div class="box" style="padding:14px">
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px">
          <div style="background:#0b2a4a;color:#fbbf24;width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center">🏆</div>
          <div><div class="navy" style="font-size:16px;font-weight:700;border-bottom:2px solid #fbbf24;display:inline-block">وثّق إنجازك</div><div style="font-size:11px;color:#6b7280">Add Your Achievement</div></div>

        <div class="form" style="border:1px solid #eee;border-left:3px solid #fbbf24;border-radius:6px;padding:4px 20px 16px">
          <div id="f-dept"><label class="req">Department</label><input value="Department A"></div>
          <div id="f-cat"><label class="req">Task Category</label><select><option></option><option>Project A</option></select></div>
          <div id="f-date"><label class="req">Task Date</label><input type="date"></div>
          <div id="f-coll"><label>Collaborators</label><select style="background:#f5f5f5"><option></option></select></div>
          <div id="f-type"><label class="req">Task Type</label>
            <div class="chips"><button>DESIGN</button><button>DEVELOPMENT</button><button>DOCUMENTATION</button><button>MEETING</button><button>OTHER</button><button>SUPPORT</button><button>TROUBLESHOOT</button><button>مهام ادارية</button></div></div>
          <div id="f-pri"><label class="req">Priority</label>
            <div class="chips"><button style="color:#15803d">Low</button><button style="color:#b45309">Medium</button><button style="color:#b91c1c">High</button></div></div>
          <div id="f-title"><label class="req">Task Title</label><input></div>
          <div id="f-desc"><label class="req">Description</label><textarea></textarea></div>
          <div id="f-obs"><label>Obstacle</label><textarea></textarea></div>
          <div id="f-file"><label>File</label><div style="border:1px solid #d1d5db;border-radius:4px;padding:5px;font-size:11px">📁 Choose Files</div></div>
        </div>
      </div>
      <button class="btn-dark" id="submitBtn" style="width:100%;margin-top:10px;padding:9px">Submit</button>
